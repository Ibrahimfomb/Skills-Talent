spring.application.name=app
spring.config.import=optional:file:.env[.properties]

# PostgreSQL
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/skills_talent}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT — obligatoire : définir JWT_SECRET (min. 64 caractères pour HS512)
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Mail (desactive en dev — remplacer par un vrai serveur en prod)
spring.mail.host=localhost
spring.mail.port=1025
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

# Server
server.port=8080

# Claude AI — définir CLAUDE_API_KEY (https://console.anthropic.com/settings/keys)
claude.api.key=${CLAUDE_API_KEY:}

# Cloudinary — définir CLOUDINARY_CLOUD_NAME / API_KEY / API_SECRET dans .env
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Multipart — taille max CV
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Webhook import secret (define WEBHOOK_SECRET in .env)
webhook.import.secret=${WEBHOOK_SECRET:change-me-in-production}

# ========== GOOGLE CALENDAR INTEGRATION ==========
# Google OAuth 2.0 Configuration
google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID:}
google.oauth.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET:}
google.oauth.redirect-uri=${GOOGLE_OAUTH_REDIRECT_URI:http://localhost:8080/api/integrations/google/callback}

# ========== FRANCE TRAVAIL INTEGRATION ==========
# France Travail API (Offres d'emploi)
france-travail.api.base-url=${FRANCE_TRAVAIL_API_BASE_URL:https://api.francetravail.io/partenaire/offresdemploi/v2}
france-travail.api.client-id=${FRANCE_TRAVAIL_CLIENT_ID:}
france-travail.api.client-secret=${FRANCE_TRAVAIL_CLIENT_SECRET:}

# ========== INTEGRATION DEFAULTS ==========
# Timeout for external API calls (milliseconds)
integration.api.timeout=${INTEGRATION_API_TIMEOUT:30000}
integration.api.max-retries=${INTEGRATION_API_MAX_RETRIES:3}
